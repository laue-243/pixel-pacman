<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Pac-Man — Improved</title>
<style>
body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; image-rendering: pixelated; font-family: monospace; }
canvas { border: 6px solid #00f; image-rendering: pixelated; box-shadow: 0 0 30px #00f; }
#ui { position: absolute; top: 15px; color: #ff0; font-size: 20px; text-shadow: 2px 2px #000; }
</style>
</head>
<body>
<div id="ui">Score: <span id="sc">0</span> | Best: <span id="bs">0</span></div>
<canvas id="game" width="480" height="480"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const G = 24;
const maze = [
  "####################",
  "#........#.........#",
  "#.##.###.#.###.##.##",
  "#...................#",
  "#.##.#.#####.#.##.##",
  "#....#...#...#.....#",
  "####.### # ###.####",
  "   #.#       #.#   ",
  "####.# ##### #.####",
  "#........#.........#",
  "#.##.###.#.###.##.##",
  "#...................#",
  "####################"
];
let pac, ghosts, dots, score, best, state, mouth, frame;

function init() {
  pac = {x:1, y:1, dir:{x:1,y:0}, next:{x:1,y:0}};
  ghosts = [
    {x:10,y:6,dir:{x:-1,y:0}, color:'#f00'},
    {x:10,y:8,dir:{x:1,y:0}, color:'#f0f'},
    {x:9,y:7,dir:{x:0,y:1}, color:'#0ff'}
  ];
  dots = [];
  for (let y=0; y<maze.length; y++) {
    for (let x=0; x<maze[y].length; x++) {
      if (maze[y][x] === '.') dots.push({x,y});
    }
  }
  score = 0;
  state = 'start';
  mouth = 0;
  frame = 0;
  updateUI();
}

function can(x,y) {
  if (y<0||y>=maze.length||x<0||x>=maze[0].length) return false;
  return maze[y][x] !== '#';
}

function updateUI() {
  document.getElementById('sc').textContent = score;
  best = Math.max(best||0, score);
  localStorage.setItem('pacBest', best);
  document.getElementById('bs').textContent = best;
}

function drawPac() {
  const px = pac.x * G + G/2;
  const py = pac.y * G + G/2;
  const open = Math.abs(Math.sin(frame * 0.3)) * 0.6 + 0.2;
  let start = 0, end = Math.PI*2;
  if (pac.dir.x === 1) { start = open; end = Math.PI*2 - open; }
  if (pac.dir.x === -1) { start = Math.PI + open; end = Math.PI - open; }
  if (pac.dir.y === -1) { start = -Math.PI/2 + open; end = -Math.PI/2 - open; }
  if (pac.dir.y === 1) { start = Math.PI/2 + open; end = Math.PI/2 - open; }
  ctx.fillStyle = '#ff0';
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.arc(px, py, G/2 - 2, start, end);
  ctx.fill();
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,480,480);
  // Walls
  for (let y=0; y<maze.length; y++) {
    for (let x=0; x<maze[y].length; x++) {
      if (maze[y][x] === '#') {
        ctx.fillStyle = '#00f';
        ctx.fillRect(x*G, y*G, G, G);
        ctx.strokeStyle = '#44f';
        ctx.strokeRect(x*G+1, y*G+1, G-2, G-2);
      }
    }
  }
  // Dots
  dots.forEach(d => {
    ctx.fillStyle = '#ff0';
    ctx.beginPath();
    ctx.arc(d.x*G+G/2, d.y*G+G/2, 3, 0, Math.PI*2);
    ctx.fill();
  });
  drawPac();
  // Ghosts
  ghosts.forEach(g => {
    ctx.fillStyle = g.color;
    ctx.beginPath();
    ctx.arc(g.x*G+G/2, g.y*G+G/2-2, G/2-3, Math.PI, 0);
    ctx.lineTo(g.x*G+G-4, g.y*G+G-2);
    ctx.lineTo(g.x*G+G/2, g.y*G+G);
    ctx.lineTo(g.x*G+4, g.y*G+G-2);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(g.x*G+6, g.y*G+6, 4, 4);
    ctx.fillRect(g.x*G+14, g.y*G+6, 4, 4);
    ctx.fillStyle = '#00f';
    ctx.fillRect(g.x*G+7, g.y*G+7, 2, 2);
    ctx.fillRect(g.x*G+15, g.y*G+7, 2, 2);
  });

  if (state === 'start') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,480,480);
    ctx.fillStyle = '#ff0';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PAC-MAN', 240, 200);
    ctx.font = '18px monospace';
    ctx.fillText('Arrow keys | SPACE to start', 240, 250);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0,0,480,480);
    ctx.fillStyle = '#f00';
    ctx.font = 'bold 32px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', 240, 200);
    ctx.fillStyle = '#ff0';
    ctx.font = '20px monospace';
    ctx.fillText('Score: '+score+'  Best: '+best, 240, 250);
    ctx.fillText('SPACE to restart', 240, 300);
  }
  if (state === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0,0,480,480);
    ctx.fillStyle = '#0f0';
    ctx.font = 'bold 32px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('YOU WIN!', 240, 200);
    ctx.fillText('Score: '+score, 240, 250);
    ctx.fillText('SPACE to play again', 240, 300);
  }
}

function update() {
  if (state !== 'play') return;
  frame++;
  if (frame % 6 !== 0) return;

  // Try next direction
  if (can(pac.x + pac.next.x, pac.y + pac.next.y)) pac.dir = pac.next;
  const nx = pac.x + pac.dir.x;
  const ny = pac.y + pac.dir.y;
  if (can(nx, ny)) { pac.x = nx; pac.y = ny; }

  // Eat
  const before = dots.length;
  dots = dots.filter(d => !(d.x===pac.x && d.y===pac.y));
  if (dots.length < before) { score += 10; updateUI(); }
  if (dots.length === 0) { state = 'win'; return; }

  // Ghosts
  ghosts.forEach(g => {
    const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
    if (Math.random()<0.15 || !can(g.x+g.dir.x, g.y+g.dir.y)) {
      const ok = dirs.filter(d => can(g.x+d.x, g.y+d.y));
      if (ok.length) g.dir = ok[Math.floor(Math.random()*ok.length)];
    }
    if (can(g.x+g.dir.x, g.y+g.dir.y)) {
      g.x += g.dir.x; g.y += g.dir.y;
    }
    if (g.x === pac.x && g.y === pac.y) state = 'over';
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  if ((state==='start'||state==='over'||state==='win') && e.code==='Space') {
    init(); state = 'play'; return;
  }
  if (state !== 'play') return;
  if (e.key==='ArrowUp') pac.next = {x:0,y:-1};
  if (e.key==='ArrowDown') pac.next = {x:0,y:1};
  if (e.key==='ArrowLeft') pac.next = {x:-1,y:0};
  if (e.key==='ArrowRight') pac.next = {x:1,y:0};
});

best = parseInt(localStorage.getItem('pacBest')||'0');
init();
loop();
</script>
</body>
</html>
